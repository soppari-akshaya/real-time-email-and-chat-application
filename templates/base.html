<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Email &amp; Real-Time Chat System{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand d-flex align-items-center gap-2" href="{{ url_for('chat_page') }}">
            <i class="bi bi-chat-square-text-fill"></i>
            <span>Team Workspace</span>
        </a>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'chat_page' %}active fw-bold{% endif %}" href="{{ url_for('chat_page') }}">
                        <i class="bi bi-chat-dots"></i> Chat (Member 2)
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'email_page' %}active fw-bold{% endif %}" href="{{ url_for('email_page') }}">
                        <i class="bi bi-envelope"></i> Email (Member 1)
                    </a>
                </li>
            </ul>

            <!-- Simple User Switcher Dropdown (No login required) -->
            <div class="d-flex align-items-center bg-white text-dark rounded px-3 py-1">
                <span class="me-2 text-muted small fw-semibold">Current User:</span>
                <select class="form-select form-select-sm border-0 fw-bold" style="width: auto; cursor: pointer;" onchange="window.location.href='/switch-user/' + this.value;">
                    {% for u in all_users %}
                    <option value="{{ u.id }}" {% if current_user and current_user.id == u.id %}selected{% endif %}>
                        {{ u.name }} ({{ u.email }})
                    </option>
                    {% endfor %}
                </select>
            </div>
        </div>
    </div>
</nav>

<!-- Page Content -->
<div class="container-fluid py-3 px-4">
    {% block content %}{% endblock %}
</div>

<!-- Bootstrap 5 and Socket.IO JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
{% block scripts %}{% endblock %}

</body>
</html>
