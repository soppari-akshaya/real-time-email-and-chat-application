{% extends "base.html" %}

{% block title %}OmniSync - User Profile &amp; Preferences{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center" style="height: 100%; padding: 2rem; overflow-y: auto;">
  <div class="card p-4" style="width: 100%; max-width: 550px; background: var(--bg-card); border: 1px solid var(--border-color); box-shadow: var(--shadow-xl); border-radius: var(--radius-lg);">
    <div class="d-flex align-items-center gap-3 mb-4 pb-3" style="border-bottom: 1px solid var(--border-color);">
      <div class="avatar-container" style="width: 64px; height: 64px;">
        <img src="{{ user.to_dict()['avatar_url'] }}" alt="{{ user.username }}" class="avatar-img">
        <span class="presence-dot online" style="width: 16px; height: 16px;"></span>
      </div>
      <div>
        <h4 style="font-weight: 800; margin-bottom: 0.2rem;">{{ user.username }}</h4>
        <div style="font-size: 0.85rem; color: var(--text-muted);">{{ user.email }}</div>
        <span class="badge bg-primary mt-1" style="font-size: 0.7rem; text-transform: uppercase;">{{ user.role }}</span>
      </div>
    </div>

    <form method="POST" action="{{ url_for('auth.profile') }}" enctype="multipart/form-data">
      <div class="mb-3">
        <label class="form-label" style="font-size: 0.85rem; font-weight: 600;">Status &amp; Bio</label>
        <input type="text" name="bio" class="form-control" value="{{ user.bio }}">
        <small class="text-muted" style="font-size: 0.75rem;">Visible to colleagues in 1-on-1 and group chats</small>
      </div>

      <div class="mb-3">
        <label class="form-label" style="font-size: 0.85rem; font-weight: 600;">Change Avatar Picture</label>
        <input type="file" name="avatar" class="form-control" accept="image/*">
      </div>

      <div class="mb-3">
        <label class="form-label" style="font-size: 0.85rem; font-weight: 600;">Update Password (Optional)</label>
        <input type="password" name="new_password" class="form-control" placeholder="Leave blank to keep current password">
      </div>

      <div class="d-flex justify-content-between align-items-center mt-4 pt-3" style="border-top: 1px solid var(--border-color);">
        <a href="{{ url_for('chat.chat_view') }}" class="btn btn-secondary">Back to Chat</a>
        <button type="submit" class="btn-primary-gradient">Save Changes</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
