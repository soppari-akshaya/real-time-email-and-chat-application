{% extends "base.html" %}

{% block title %}OmniSync - Register New Account{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center" style="height: 100%; padding: 2rem;">
  <div class="card p-4" style="width: 100%; max-width: 480px; background: var(--bg-card); border: 1px solid var(--border-color); box-shadow: var(--shadow-xl); border-radius: var(--radius-lg);">
    <div class="text-center mb-4">
      <div class="brand-icon mx-auto mb-2" style="width: 48px; height: 48px; font-size: 1.5rem;">
        <i class="bi bi-clouds-fill"></i>
      </div>
      <h3 style="font-weight: 800;">Create OmniSync Account</h3>
      <p class="text-muted" style="font-size: 0.875rem;">One account for Email Management and Real-Time Chat</p>
    </div>

    <form method="POST" action="{{ url_for('auth.register') }}">
      <div class="mb-3">
        <label class="form-label" style="font-size: 0.85rem; font-weight: 600;">Username *</label>
        <input type="text" name="username" class="form-control" placeholder="john_doe" value="{{ username or '' }}" required>
      </div>

      <div class="mb-3">
        <label class="form-label" style="font-size: 0.85rem; font-weight: 600;">Email Address *</label>
        <input type="email" name="email" class="form-control" placeholder="john@omnisync.com" value="{{ email or '' }}" required>
      </div>

      <div class="row g-2 mb-3">
        <div class="col-6">
          <label class="form-label" style="font-size: 0.85rem; font-weight: 600;">Password *</label>
          <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>
        <div class="col-6">
          <label class="form-label" style="font-size: 0.85rem; font-weight: 600;">Confirm Password *</label>
          <input type="password" name="confirm_password" class="form-control" placeholder="••••••••" required>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label" style="font-size: 0.85rem; font-weight: 600;">About / Bio</label>
        <input type="text" name="bio" class="form-control" placeholder="Software Engineer | Tech Enthusiast">
      </div>

      <button type="submit" class="btn-primary-gradient w-100 justify-content-center py-2 mt-2">
        <i class="bi bi-person-check-fill"></i> Create Account
      </button>
    </form>

    <div class="text-center mt-3">
      <span style="font-size: 0.85rem; color: var(--text-muted);">Already registered?</span>
      <a href="{{ url_for('auth.login') }}" style="font-size: 0.85rem; font-weight: 600; text-decoration: none; color: var(--primary);">Sign in</a>
    </div>
  </div>
</div>
{% endblock %}
